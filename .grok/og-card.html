<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
@font-face {
  font-family: Syne;
  src: url("fonts/Syne-SemiBold.ttf") format("truetype");
  font-weight: 600;
  font-style: normal;
}
@font-face {
  font-family: Syne;
  src: url("fonts/Syne-ExtraBold.ttf") format("truetype");
  font-weight: 800;
  font-style: normal;
}
@font-face {
  font-family: "Plus Jakarta Sans";
  src: url("fonts/PlusJakarta-Medium.ttf") format("truetype");
  font-weight: 500;
  font-style: normal;
}
html, body {
  margin: 0;
  padding: 0;
  width: 1200px;
  height: 630px;
  overflow: hidden;
  background: #080808;
}
.card {
  position: relative;
  width: 1200px;
  height: 630px;
  background: #080808;
  overflow: hidden;
}
.glow {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 58% 70% at 78% 42%, rgba(240, 180, 41, 0.16), transparent 62%),
    radial-gradient(ellipse 36% 48% at 16% 78%, rgba(91, 140, 222, 0.06), transparent 70%);
  pointer-events: none;
}
.bee {
  position: absolute;
  right: -4px;
  top: 0;
  height: 630px;
  width: auto;
  z-index: 1;
  mask-image: linear-gradient(to right, transparent 0%, #000 16%, #000 100%);
  -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 16%, #000 100%);
}
.copy {
  position: absolute;
  left: 76px;
  top: 0;
  height: 630px;
  width: 640px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  z-index: 2;
}
.mark {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  display: block;
  margin-bottom: 20px;
  box-shadow: 0 0 0 1px rgba(240, 180, 41, 0.42);
  object-fit: cover;
}
.brand {
  font-family: Syne, sans-serif;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.32em;
  color: #F0B429;
  margin: 0 0 14px;
  text-transform: uppercase;
}
h1 {
  font-family: Syne, sans-serif;
  font-weight: 800;
  font-size: 68px;
  line-height: 0.98;
  letter-spacing: -0.035em;
  color: #F0B429;
  margin: 0;
}
.rule {
  width: 56px;
  height: 2px;
  background: #F0B429;
  margin: 22px 0 18px;
  border-radius: 1px;
}
.sub {
  font-family: "Plus Jakarta Sans", sans-serif;
  font-weight: 500;
  font-size: 22px;
  line-height: 1.3;
  color: #F6F3EB;
  margin: 0;
  max-width: 22em;
}
</style>
</head>
<body>
  <div class="card">
    <div class="glow"></div>
    <img class="bee" src="bee-plate.jpg" alt="" />
    <div class="copy">
      <img class="mark" src="mark-tile.png" alt="" />
      <p class="brand">BuzzCraft</p>
      <h1>The 120<br />Prompt OS</h1>
      <div class="rule"></div>
      <p class="sub">AI prompts for South African businesses</p>
    </div>
  </div>
</body>
</html>
